<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0c4a6e" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with rounded squircle for maskable/app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner Soft Glow -->
  <circle cx="256" cy="200" r="180" fill="#38bdf8" opacity="0.15" />

  <!-- Main Water Droplet Container -->
  <g filter="url(#shadow)">
    <!-- Main Drop Path -->
    <path d="M256 90 C256 90 144 240 144 330 C144 391.85 194.15 442 256 442 C317.85 442 368 391.85 368 330 C368 240 256 90 256 90 Z" fill="url(#water)" />

    <!-- Inner Highlights -->
    <path d="M256 125 C256 125 174 245 174 325 C174 370 210 412 256 412 C240 412 205 385 205 328 C205 260 256 125 256 125 Z" fill="url(#shine)" opacity="0.6" />

    <!-- Water Waves inside drop -->
    <path d="M165 345 C200 360 230 330 270 345 C305 358 340 338 350 330 C345 378 305 418 256 418 C207 418 170 380 165 345 Z" fill="#ffffff" opacity="0.25" />
    
    <!-- Sparkle Accent -->
    <circle cx="210" cy="230" r="16" fill="#ffffff" opacity="0.8" />
    <circle cx="190" cy="270" r="8" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Mineral Plus Accent -->
  <g transform="translate(320, 160)">
    <circle cx="20" cy="20" r="32" fill="#10b981" filter="url(#shadow)" />
    <path d="M20 8 L20 32 M8 20 L32 20" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
